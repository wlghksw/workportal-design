<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>에듀올랩 · 로그인</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=home8" />
  </head>
  <body>
    <div class="login-wrap">
      <form class="login" id="loginForm" autocomplete="on">
        <a class="brand brand--stack" href="/" style="margin-bottom: 22px;">
          <img
            class="brand__logo"
            src="/assets/eduallab-logo.png"
            alt="에듀올랩"
          />
          <span class="brand__sub">통합 업무 포탈</span>
        </a>
        <h1>로그인</h1>
        <p id="loginSub">업무 자동화 서비스에 접근하려면 로그인하세요.</p>

        <div class="error" id="loginError">아이디 또는 비밀번호가 올바르지 않습니다.</div>

        <div class="field">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn">로그인</button>

        <p style="margin-top:14px; font-size:12px; color:var(--text-soft);">
          * 계정 정보는 관리자에게 문의하세요.
        </p>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const ret = params.get("return") || "/";
      const sub = document.getElementById("loginSub");

      // return 이 외부 서비스를 가리키면 안내 문구를 살짝 바꿔줌
      try {
        const u = new URL(ret, location.href);
        if (u.origin !== location.origin) {
          sub.textContent = `${u.host} 에 접근하려면 먼저 로그인하세요.`;
        }
      } catch {
        /* noop */
      }

      const form = document.getElementById("loginForm");
      const err = document.getElementById("loginError");
      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        err.classList.remove("is-show");
        const data = Object.fromEntries(new FormData(form).entries());
        try {
          const r = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (r.ok) {
            // 같은 출처면 그대로 이동, 외부면 절대 URL 로 이동
            location.href = ret;
          } else {
            err.classList.add("is-show");
          }
        } catch {
          err.classList.add("is-show");
        }
      });
    </script>
  </body>
</html>
