<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>뉴스 수집 목록 — 디자인 프리뷰</title>
  <link rel="stylesheet" href="/shared/portal-header.css?v=1" />
  <style>
    :root { --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --primary:#0088cc; --border:#e2e8f0; }
    body { margin:0; font-family:'Noto Sans KR',sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:1.5rem; margin:0 0 8px; }
    .sub { color:var(--muted); margin-bottom:24px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; margin-bottom:12px; }
    .card h2 { font-size:1rem; margin:0 0 6px; }
    .meta { font-size:.8rem; color:var(--muted); }
    .badge { display:inline-block; background:#eff6ff; color:var(--primary); padding:2px 8px; border-radius:999px; font-size:.75rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>교육 뉴스 수집</h1>
    <p class="sub">디자인 협업용 정적 프리뷰 (실제 데이터/API 없음)</p>
    <div class="card"><span class="badge">구글 뉴스 · 교육</span><h2>늘봄학교 정책 확대, 지자체별 운영 가이드 공개</h2><p class="meta">2026.06.05 · 연합뉴스</p></div>
    <div class="card"><span class="badge">네이버 · 유아교육</span><h2>AI 기반 영어 동화 콘텐츠, 교육 현장 도입 사례 증가</h2><p class="meta">2026.06.04 · 교육신문</p></div>
    <div class="card"><span class="badge">구글 뉴스 · EdTech</span><h2>방과후 학교 디지털 전환 지원 예산 확정</h2><p class="meta">2026.06.03 · 매일경제</p></div>
  </div>
  <script src="/shared/portal-header.js?v=1" defer></script>
</body>
</html>
